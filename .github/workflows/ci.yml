# Lint, unit tests, build and package check for every pull request and push to main.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # No install scripts: a dev tool fetches and runs a package from npm that the lockfile
      # does not pin. None of them is needed; the package comes out byte for byte the same.
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Only the expected files, and nothing secret or internal in them.
      - run: npm run check:package
      # The release's stage job checks the packed file this way, with nothing installed.
      - name: Check the packed file as the release does
        run: |
          file=$(npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename')
          mkdir -- "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/unpacked" --strip-components=1 --no-same-owner --no-same-permissions
          node scripts/check-package.mjs --unpacked "$RUNNER_TEMP/unpacked"
