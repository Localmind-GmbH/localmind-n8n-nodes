# Publishes the package to npm with a provenance statement, then creates the version tag and a
# GitHub release with the published package and a signed attestation.
# n8n requires provenance for verified community nodes. Provenance proves that the
# package was built by this workflow, from this repository and commit.
#
# A release is started by hand, from main only: Actions > Publish > Run workflow. The version
# comes from package.json, raised beforehand in a reviewed pull request; a second maintainer
# then approves the run. Tags start nothing: the workflow creates them after publishing.
#
# Three jobs, so that publishing rights never meet third-party code:
#   build    checks that the version is new, installs the dev tools (without their install
#            scripts), checks and packs the package. No publishing rights, no npm token.
#   publish  installs nothing and runs only this repository's code. After a reviewer's
#            approval it checks the file the build job packed (its SHA-256, its package.json
#            against the repository's, its contents) and publishes exactly that file.
#   github-release  checks that npm serves that file and package.json, then tags the commit
#            and attaches the file with its attestation to a GitHub release.
#
# A failed run can be re-run ("Re-run failed jobs"): publish skips a version npm already has
# from this very file, and github-release accepts a tag that already names this commit.
#
# One-time setup on GitHub:
#   Settings > Environments > "npm-publish": required reviewers (a second maintainer
#   approves every publish), "Prevent self-review", no administrator bypass, deployment
#   branches limited to "main" and no tag rule: older commits hold tag-triggered versions of
#   this workflow, which only this rule keeps from publishing.
#   Settings > Rules > a tag ruleset for "v*.*.*": restrict updates and deletions, block
#   force pushes (creations stay allowed: this workflow creates the tags).
#   Settings > General > Releases: release immutability.
#
# One-time setup on npmjs.com (trusted publishing, no long-lived token):
#   Package settings > Trusted Publishers > GitHub Actions: repository owner and name
#   of this repository, workflow "publish.yml", environment "npm-publish".
#   A trusted publisher can only be added to a package that exists: the first version is
#   published with the NPM_FIRST_PUBLISH_TOKEN secret of the "npm-publish" environment (see
#   RELEASING.md). The workflow refuses that token once the package exists.
#   package.json's repository.url must name this GitHub repository for provenance.

name: Publish

on:
  workflow_dispatch:

# One release at a time; a running publish is never cancelled.
concurrency:
  group: publish
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    outputs:
      file: ${{ steps.pack.outputs.file }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency cache in a release: a poisoned cache could change what is published.
          package-manager-cache: false

      - name: Check that it runs on main, for a version not released yet
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases run from main only, not from $GITHUB_REF"
            exit 1
          fi
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          # npm publishes a prerelease, or a version below the latest, only with a tag of its
          # own; refused here, before anyone approves the run.
          if ! printf '%s' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Version $version is not of the form X.Y.Z; prereleases are not published by this workflow"
            exit 1
          fi
          if lookup=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>&1); then
            echo "::error::Tag $tag exists already: raise the version in package.json first"
            exit 1
          elif ! echo "$lookup" | grep -q 'HTTP 404'; then
            echo "::error::Could not check the tags: $lookup"
            exit 1
          fi
          # Only "not found" (E404) means "not published"; any other failure stops the run.
          if published=$(npm view "$name@$version" version 2>&1); then
            if [ -n "$published" ]; then
              echo "::error::$name@$version is on npm already: raise the version in package.json first"
              exit 1
            fi
          elif ! echo "$published" | grep -q E404; then
            echo "::error::Could not ask npm for $name@$version: $published"
            exit 1
          fi
          if latest=$(npm view "$name" dist-tags.latest 2>&1); then
            :
          elif echo "$latest" | grep -q E404; then
            latest=
          else
            echo "::error::Could not ask npm for the latest version: $latest"
            exit 1
          fi
          if [ -n "$latest" ] && ! node -e '
            const [a, b] = process.argv.slice(1).map((v) => v.split(".").map(Number));
            const order = a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            process.exit(order > 0 ? 0 : 1);
          ' "$version" "$latest"; then
            echo "::error::Version $version is not higher than the latest on npm, $latest"
            exit 1
          fi

      # No install scripts: a dev tool fetches and runs a package from npm that the lockfile
      # does not pin. None of them is needed; the package comes out byte for byte the same.
      - run: npm ci --ignore-scripts
      # Fails when a dependency's registry signature or attestation does not verify.
      - run: npm audit signatures
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Only the expected files, and nothing secret or internal in them.
      - run: npm run check:package

      - name: Pack the package
        id: pack
        run: |
          file=$(npm pack --ignore-scripts --json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename')
          sha256=$(sha256sum -- "$file" | cut -d ' ' -f 1)
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          # For the approver. The publish job checks the file again, with nothing installed.
          {
            echo "### $file"
            echo "SHA-256: \`$sha256\`"
            echo '```'
            tar -tzvf "$file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error
          # The approval can take a while; past this, run the workflow again.
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Waits for a reviewer's approval; only main may deploy to this environment.
    environment: npm-publish
    permissions:
      contents: read # check out this repository, read its tags
      id-token: write # OIDC token for npm trusted publishing and provenance
    defaults:
      run:
        working-directory: repository
    steps:
      # This repository's code only (package.json, the package check); nothing is installed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: repository

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
          node-version: 24
          package-manager-cache: false

      # Name, version and tag come from the repository, never from the build job: its outputs are
      # only the file name and SHA-256, both checked. A forged name (a git address, say) handed to
      # npm here would run code with this job's rights.
      - name: Read the version from the repository
        working-directory: repository
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$name" != "@localmind/n8n-nodes-localmind" ] || ! printf '%s' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Unexpected name or version in package.json: $name $version"
            exit 1
          fi
          {
            echo "PKG_NAME=$name"
            echo "PKG_SPEC=$name@$version"
            echo "TAG=v$version"
            echo "EXPECTED_FILE=localmind-n8n-nodes-localmind-$version.tgz"
          } >> "$GITHUB_ENV"

      # Outside the checkout, so that the download cannot replace the repository's files.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package

      - name: Check that it is the file the build job packed
        env:
          FILE: ${{ needs.build.outputs.file }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          PACKAGE_DIR: ${{ runner.temp }}/package
        run: |
          if [ "$FILE" != "$EXPECTED_FILE" ] || ! printf '%s' "$SHA256" | grep -Eqx '[0-9a-f]{64}'; then
            echo "::error::The build job named an unexpected file or SHA-256"
            exit 1
          fi
          if [ "$(ls -A -- "$PACKAGE_DIR")" != "$FILE" ]; then
            echo "::error::The artifact holds other files than $FILE"
            exit 1
          fi
          actual=$(sha256sum -- "$PACKAGE_DIR/$FILE" | cut -d ' ' -f 1)
          if [ "$actual" != "$SHA256" ]; then
            echo "::error::$FILE is not the file the build job packed"
            exit 1
          fi

      # The package as customers would install it: package.json byte for byte the repository's
      # (name, version, no install scripts, no dependencies), only the expected files, nothing
      # secret or internal. Checked here as well, where no dev tool has run.
      - name: Check the contents of the package
        env:
          PACKAGE_DIR: ${{ runner.temp }}/package
          UNPACKED: ${{ runner.temp }}/unpacked
        run: |
          mkdir -- "$UNPACKED"
          tar -xzf "$PACKAGE_DIR/$EXPECTED_FILE" -C "$UNPACKED" --strip-components=1 --no-same-owner --no-same-permissions
          node scripts/check-package.mjs --unpacked "$UNPACKED"

      # Checked again right before publishing: a tag created on another commit during the
      # approval wait would stop the release only after npm has the version.
      - name: Check that the tag is free
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if tagged=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>&1); then
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG was created on another commit ($tagged) meanwhile"
              exit 1
            fi
          elif ! echo "$tagged" | grep -q 'HTTP 404'; then
            echo "::error::Could not check the tag: $tagged"
            exit 1
          fi

      # The first version only: NPM_FIRST_PUBLISH_TOKEN, refused once the package exists, since
      # from then on trusted publishing takes over. Publishing a packed file runs none of the
      # package's scripts. A re-run finds the version published from this file and stops there.
      - name: Publish to npm
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
          PACKAGE_DIR: ${{ runner.temp }}/package
          FIRST_PUBLISH_TOKEN: ${{ secrets.NPM_FIRST_PUBLISH_TOKEN }}
        run: |
          if exists=$(npm view "$PKG_NAME" name 2>&1); then
            package_exists=yes
          elif echo "$exists" | grep -q E404; then
            package_exists=no
          else
            echo "::error::Could not ask npm for $PKG_NAME: $exists"
            exit 1
          fi
          if [ -n "$FIRST_PUBLISH_TOKEN" ]; then
            if [ "$package_exists" = yes ]; then
              echo "::error::$PKG_NAME exists on npm: delete the NPM_FIRST_PUBLISH_TOKEN secret, publishing uses trusted publishing now"
              exit 1
            fi
            echo "::warning::Publishing with NPM_FIRST_PUBLISH_TOKEN: afterwards set up trusted publishing, delete the secret and revoke the token (RELEASING.md)"
            npm config set //registry.npmjs.org/:_authToken "$FIRST_PUBLISH_TOKEN"
          fi
          if [ "$package_exists" = yes ]; then
            if published=$(npm view "$PKG_SPEC" version 2>&1); then
              :
            elif echo "$published" | grep -q E404; then
              published=
            else
              echo "::error::Could not ask npm for $PKG_SPEC: $published"
              exit 1
            fi
            if [ -n "$published" ]; then
              mkdir -p -- "$RUNNER_TEMP/registry"
              npm pack "$PKG_SPEC" --ignore-scripts --silent --pack-destination "$RUNNER_TEMP/registry" > /dev/null
              if [ "$(sha256sum -- "$RUNNER_TEMP/registry/$EXPECTED_FILE" | cut -d ' ' -f 1)" = "$SHA256" ]; then
                echo "::notice::$PKG_SPEC is on npm from this very file already (a re-run); not published again"
                exit 0
              fi
              echo "::error::$PKG_SPEC is on npm already, from another file"
              exit 1
            fi
          fi
          npm publish "$PACKAGE_DIR/$EXPECTED_FILE" --provenance --access public

  github-release:
    # The package exactly as npm serves it, for installations without npm access.
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the tag and the release
      id-token: write # sign the attestation
      attestations: write # store the attestation
    steps:
      # For package.json only; nothing from it runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: repository

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # Name, version and tag come from the repository, never from the build job: its outputs are
      # only the file name and SHA-256, both checked. A forged name (a git address, say) handed to
      # npm here would run code with this job's rights.
      - name: Read the version from the repository
        working-directory: repository
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$name" != "@localmind/n8n-nodes-localmind" ] || ! printf '%s' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Unexpected name or version in package.json: $name $version"
            exit 1
          fi
          {
            echo "PKG_NAME=$name"
            echo "PKG_SPEC=$name@$version"
            echo "TAG=v$version"
            echo "EXPECTED_FILE=localmind-n8n-nodes-localmind-$version.tgz"
          } >> "$GITHUB_ENV"

      - name: Download the published package
        run: |
          mkdir -- release && cd release
          # The registry can take a moment to serve a new version. npm checks the
          # download against the integrity the registry recorded at publishing.
          for attempt in 1 2 3 4 5 6; do
            npm pack "$PKG_SPEC" --ignore-scripts && break
            [ "$attempt" = 6 ] && exit 1
            sleep 10
          done
          sha256sum -- "$EXPECTED_FILE" > SHA256SUMS

      - name: Check that npm serves the file the build job packed
        working-directory: release
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          if [ "$(ls -- *.tgz)" != "$EXPECTED_FILE" ] || [ "$(sha256sum -- "$EXPECTED_FILE" | cut -d ' ' -f 1)" != "$SHA256" ]; then
            echo "::error::The package on npm differs from the one this workflow built"
            exit 1
          fi

      # npm installs by the registry's record of the package, which a publishing client could
      # make differ from the package.json in the file: compared with the repository's for
      # everything that changes what an installation does.
      - name: Check the package as npm describes it
        run: |
          npm view "$PKG_SPEC" --json > "$RUNNER_TEMP/registry.json"
          node -e '
            const fs = require("fs");
            const record = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const repo = JSON.parse(fs.readFileSync("repository/package.json", "utf8"));
            const same = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
            const fields = ["name", "version", "dependencies", "optionalDependencies", "peerDependencies",
              "peerDependenciesMeta", "bundleDependencies", "bundledDependencies", "bin", "os", "cpu",
              "engines", "gypfile"];
            const differs = fields.filter((field) => !same(record[field], repo[field]));
            const hooks = ["preinstall", "install", "postinstall", "prepare", "prepublish"]
              .filter((name) => record.scripts?.[name] !== repo.scripts?.[name]);
            if (record._hasShrinkwrap) differs.push("_hasShrinkwrap");
            if (differs.length || hooks.length) {
              console.error(`::error::npm describes the package differently from package.json: ${[...differs, ...hooks].join(", ")}`);
              process.exit(1);
            }
          ' "$RUNNER_TEMP/registry.json"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.tgz

      # Through the API, which refuses a tag that exists: one someone created during the approval
      # wait would otherwise carry the release. A re-run finds its own tag on this commit.
      - name: Tag the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent; then
            tagged=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG exists and names another commit ($tagged), not $GITHUB_SHA"
              exit 1
            fi
          fi

      # A re-run accepts an existing release only when it is published and holds this very file.
      - name: Create the GitHub release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > "$RUNNER_TEMP/draft" 2>/dev/null; then
            if [ "$(cat -- "$RUNNER_TEMP/draft")" != false ]; then
              echo "::error::The release $TAG exists as a draft; delete it and re-run"
              exit 1
            fi
            mkdir -- "$RUNNER_TEMP/existing"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$EXPECTED_FILE" --dir "$RUNNER_TEMP/existing"
            if [ "$(sha256sum -- "$RUNNER_TEMP/existing/$EXPECTED_FILE" | cut -d ' ' -f 1)" != "$SHA256" ]; then
              echo "::error::The release $TAG exists with another file"
              exit 1
            fi
            echo "::notice::The release $TAG exists already with this file (a re-run)"
            exit 0
          fi
          verify="gh attestation verify $EXPECTED_FILE --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/publish.yml --source-ref refs/heads/main"
          gh release create "$TAG" "$EXPECTED_FILE" SHA256SUMS --verify-tag \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes "The package as published on npm, for installation without npm access (customer guide, offline installation). Verify it before installing: \`$verify\`, and compare its SHA-256 with SHA256SUMS. Changes: see CHANGELOG.md."
