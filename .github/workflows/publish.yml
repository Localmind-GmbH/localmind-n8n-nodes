# Publishes the package to npm with a provenance statement, then creates the version tag and a
# GitHub release with the published package and a signed attestation.
# n8n requires provenance for verified community nodes. Provenance proves that the
# package was built by this workflow, from this repository and commit.
#
# A release is started by hand, from main only: Actions > Publish > Run workflow. The version
# comes from package.json, raised beforehand in a reviewed pull request; a second maintainer
# then approves the run. Tags start nothing: the workflow creates them after publishing.
#
# Three jobs, so that publishing rights never meet third-party code:
#   build    checks that the version is new, installs the dev tools (without their install
#            scripts), checks and packs the package. No publishing rights, no npm token.
#   publish  installs nothing. After a reviewer's approval it publishes exactly the file
#            the build job packed, checked by its SHA-256.
#   github-release  checks that npm serves that file, then tags the commit and attaches the
#            file with its attestation to a GitHub release.
#
# One-time setup on GitHub:
#   Settings > Environments > "npm-publish": required reviewers (a second maintainer
#   approves every publish), "Prevent self-review", no administrator bypass, deployment
#   branches limited to "main".
#   Settings > Rules > a tag ruleset for "v*.*.*": restrict updates and deletions, block
#   force pushes (creations stay allowed: this workflow creates the tags).
#   Settings > General > Releases: release immutability.
#
# One-time setup on npmjs.com (trusted publishing, no long-lived token):
#   Package settings > Trusted Publishers > GitHub Actions: repository owner and name
#   of this repository, workflow "publish.yml", environment "npm-publish".
#   A trusted publisher can only be added to a package that exists: the first version is
#   published with an npm token in the "npm-publish" environment (see RELEASING.md).
#   package.json's repository.url must name this GitHub repository for provenance.

name: Publish

on:
  workflow_dispatch:

# One release at a time; a running publish is never cancelled.
concurrency:
  group: publish
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package: ${{ steps.version.outputs.package }}
      tag: ${{ steps.version.outputs.tag }}
      file: ${{ steps.pack.outputs.file }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency cache in a release: a poisoned cache could change what is published.
          package-manager-cache: false

      - name: Check that it runs on main, for a version not released yet
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases run from main only, not from $GITHUB_REF"
            exit 1
          fi
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if lookup=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>&1); then
            echo "::error::Tag $tag exists already: raise the version in package.json first"
            exit 1
          elif ! echo "$lookup" | grep -q 'HTTP 404'; then
            echo "::error::Could not check the tags: $lookup"
            exit 1
          fi
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "::error::$name@$version is on npm already: raise the version in package.json first"
            exit 1
          fi
          # npm publishes a prerelease, or a version below the latest, only with a tag of its
          # own; refused here, before anyone approves the run.
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version $version is not of the form X.Y.Z; prereleases are not published by this workflow"
            exit 1
          fi
          latest=$(npm view "$name" dist-tags.latest 2>/dev/null || true)
          if [ -n "$latest" ] && ! node -e '
            const [a, b] = process.argv.slice(1).map((v) => v.split(".").map(Number));
            const order = a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            process.exit(order > 0 ? 0 : 1);
          ' "$version" "$latest"; then
            echo "::error::Version $version is not higher than the latest on npm, $latest"
            exit 1
          fi
          echo "package=$name@$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # No install scripts: a dev tool fetches and runs a package from npm that the lockfile
      # does not pin. None of them is needed; the package comes out byte for byte the same.
      - run: npm ci --ignore-scripts
      # Fails when a dependency's registry signature or attestation does not verify.
      - run: npm audit signatures
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Only the expected files, and nothing secret or internal in them.
      - run: npm run check:package

      - name: Pack the package
        id: pack
        run: |
          file=$(npm pack --ignore-scripts --json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename')
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum -- "$file" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error
          # The approval can take a while; past this, run the workflow again.
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Waits for a reviewer's approval; only main may deploy to this environment.
    environment: npm-publish
    permissions:
      id-token: write # OIDC token for npm trusted publishing and provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
          node-version: 24
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: Check that it is the file the build job packed
        env:
          FILE: ${{ needs.build.outputs.file }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: echo "$SHA256  $FILE" | sha256sum --check --strict -

      # With the NPM_TOKEN secret set (first publish only) the token is used; without it,
      # trusted publishing. Publishing a packed file runs none of the package's scripts.
      - name: Publish to npm
        env:
          FILE: ${{ needs.build.outputs.file }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm publish "./$FILE" --provenance --access public

  github-release:
    # The package exactly as npm serves it, for installations without npm access.
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
      id-token: write # sign the attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download the published package
        env:
          PACKAGE: ${{ needs.build.outputs.package }}
        run: |
          # The registry can take a moment to serve a new version. npm checks the
          # download against the integrity the registry recorded at publishing.
          for attempt in 1 2 3 4 5 6; do
            npm pack "$PACKAGE" && break
            [ "$attempt" = 6 ] && exit 1
            sleep 10
          done
          sha256sum -- *.tgz > SHA256SUMS

      - name: Check that npm serves the file the build job packed
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          if ! grep -q "^$SHA256 " SHA256SUMS; then
            echo "::error::The package on npm differs from the one this workflow built"
            exit 1
          fi

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: '*.tgz'

      - name: Tag the commit and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          file=$(ls -- *.tgz)
          gh release create "$TAG" "$file" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" \
            --notes "The package as published on npm, for installation without npm access (customer guide, offline installation). Verify it before installing: \`gh attestation verify $file --repo $GITHUB_REPOSITORY\`, or compare its SHA-256 with SHA256SUMS. Changes: see CHANGELOG.md."
